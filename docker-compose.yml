services:
  telegram-bot:
    image: python:alpine
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "apk add --no-cache ffmpeg bash build-base libffi-dev && pip install -r requirements.txt && python bot.py"
    restart: unless-stopped

    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      placement:
        max_replicas_per_node: 1
