global_defs {
    script_user root
    enable_script_security
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass robin0171
    }
    virtual_ipaddress {
        192.168.5.100
    }
    notify_master "/etc/keepalived/bot_ha.sh master"
    notify_backup "/etc/keepalived/bot_ha.sh backup"
}
