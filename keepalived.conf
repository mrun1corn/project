global_defs {
    script_user root
    enable_script_security
}

vrrp_instance VI_1 {
    state MASTER                     # Set BACKUP on the secondary node
    interface eth0                   # Replace with the correct network interface
    virtual_router_id 51             # Must match on both nodes
    priority 101                     # Higher value on primary (e.g. 101 vs 100)
    advert_int 1                     # Heartbeat interval in seconds
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME          # Replace with a shared secret
    }
    virtual_ipaddress {
        192.168.5.100                # Floating IP
    }
    notify_master "/etc/keepalived/bot_ha.sh master"
    notify_backup "/etc/keepalived/bot_ha.sh backup"
}
